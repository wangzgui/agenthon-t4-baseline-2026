name: Diagnose S1.1 production NLI core

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  nli:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install official judge and pinned contracts
        run: |
          pip install 'qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.4.4#subdirectory=common'
          pip install torch transformers sentencepiece
          git clone --depth 1 https://github.com/Agenthon-2026/track4-analysis-public.git official
      - name: Check the three floor-score task shapes
        env:
          PYTHONPATH: ${{ github.workspace }}/official
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          mkdir -p output "$RUNNER_TEMP/nli-cache"
          echo 'NLI checks below use the offline fallback answer, not inaccessible House run outputs.'
          for name in t4-fomc-curve-20220728 t4-fomc-curve-20240918 t4-postearn-20240201-megacap; do
            unit="official/units/$name"
            python agent_s11.py analyze --task "$unit/task.json" --corpus "$unit/corpus" --out "output/$name.json"
            python nli_check_s11.py --unit "$unit" --answer "output/$name.json" --cache-dir "$RUNNER_TEMP/nli-cache"
          done
