name: Build and publish T4 S1.6

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install official validator
        run: pip install 'qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.5.1#subdirectory=common'
      - name: Fetch public practice units
        run: |
          git clone https://github.com/Agenthon-2026/track4-analysis-public.git official
          git -C official checkout fe313cee2865fbfbe47b65a8fcf7b830a40ea141
      - name: Verify public contracts and citations
        run: |
          pip install jsonschema
          python verify_s16.py official/units
          python test_s16_house.py official/units
          mkdir -p reports
          cp test-output/s16-verification.json reports/
      - name: Build linux/amd64 image
        run: docker build --platform linux/amd64 -f Dockerfile.s16 -t ghcr.io/${{ github.repository }}:s1.6 .
      - name: Check every published unit
        run: |
          set -euo pipefail
          for unit in official/units/*; do
            [ -f "$unit/task.json" ] || continue
            mkdir -p output
            docker run --rm --network none \
              -v "$PWD/$unit:/input:ro" -v "$PWD/output:/output" \
              ghcr.io/${{ github.repository }}:s1.6 \
              analyze --task /input/task.json --corpus /input/corpus --out /output/answer.json
            python - "$unit" <<'PY'
          import importlib.resources as r, json, jsonschema, sys
          from pathlib import Path
          schema = json.loads((r.files('qfbench2_common')/'schemas'/'analysis.schema.json').read_text())
          answer = json.loads(Path('output/answer.json').read_text())
          task = json.loads((Path(sys.argv[1])/'task.json').read_text())
          jsonschema.validate(answer, schema)
          assert answer['task_id'] == task['task_id']
          assert len(answer['entity_predictions']) == len(task['entities'])
          assert all(row['claims'] for row in answer['entity_predictions'])
          PY
            PYTHONPATH="$PWD/official" qfbench2-smoke "$unit" "$PWD/output" --track analysis
            rm -f output/answer.json
          done
      - name: Save validation results
        uses: actions/upload-artifact@v4
        with:
          name: s16-validation
          path: reports/
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:s1.6
